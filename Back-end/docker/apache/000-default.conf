# Vhost para http://localhost (sin subdominio): solo una página de aviso
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/default
    <Directory /var/www/default>
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
# Vhost dinámico: http://<proyecto>.localhost -> /var/www/projects/<proyecto>/public
<VirtualHost *:80>
    ServerName proyectos.localhost
    ServerAlias *.localhost
    VirtualDocumentRoot /var/www/projects/%1/public
    <Directory /var/www/projects>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>