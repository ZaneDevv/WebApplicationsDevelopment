; Reporte de errores para desarrollo
display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL
; Recursos
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
; Subida de archivos y formularios
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 5000
; Zona horaria y codificación
date.timezone = Europe/Madrid
default_charset = "UTF-8"
; Sesiones (2 horas, para no perder el trabajo durante una clase larga)
session.gc_maxlifetime = 7200