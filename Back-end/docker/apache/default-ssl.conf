<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName localhost
        DocumentRoot /var/www/default
        <Directory /var/www/default>
            Require all granted
        </Directory>
        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/wildcard-localhost.pem
        SSLCertificateKeyFile /etc/ssl/private/wildcard-localhost-key.pem
    </VirtualHost>
    <VirtualHost *:443>
        ServerName proyectos.localhost
        ServerAlias *.localhost
        VirtualDocumentRoot /var/www/projects/%1/public
        <Directory /var/www/projects>
            Options Indexes FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>
        SSLEngine on
        SSLCertificateFile /etc/ssl/certs/wildcard-localhost.pem
        SSLCertificateKeyFile /etc/ssl/private/wildcard-localhost-key.pem
    </VirtualHost>
</IfModule>