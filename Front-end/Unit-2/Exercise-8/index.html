<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="./src/styles/style.css">

        <title>User data</title>
    
        <script defer src="./src/scripts/index.js"></script>
    </head>

    <body>
        <div>
            <h2>Browser data</h2>
            <p id="browser"></p>
            <p id="language"></p>
            <p id="platform"></p>
            <p id="resolution"></p>
        </div>

        <div>
            <h2>URL data</h2>
            <p id="url"></p>
        </div>

        <div>
            <h2>Navigator</h2>
            <p id="url-button" title="Go to a different page">Go to a different page</p>
        </div>

        <div>
            <h2>Screen data</h2>
            <p id="total-resolution"></p>
            <p id="available-area"></p>
            <p id="orientation"></p>
            <p id="color-depth"></p>
            <p id="pixel-depth"></p>
        </div>
    </body>
</html>
