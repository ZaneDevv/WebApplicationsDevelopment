<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="../styles/clock.css">
        <script defer src="../scripts/clock.js"></script>

        <title>Clock</title>
    </head>

    <body>
        <h1>Stopwatch</h1>
        <p>Vanilla JavaScript Stopwatch</p>

        <p id="timer">00:00</p>

        <div id="div-container">

            <p class="button" id="stop">Stop</p>
            <p class="button" id="reset">Reset</p>
        </div>
    </body>
</html>
